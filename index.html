<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light" data-fontsize="md">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مصحف التنقل — حفظ القرآن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F7F2E7;
    --bg-deep: #EEE5D2;
    --surface: #FFFFFF;
    --surface-soft: #FBF7EE;
    --ink: #2B2620;
    --ink-soft: #7A7161;
    --line: #E4D9BF;
    --accent: #3E6259;
    --accent-deep: #2A463D;
    --accent-soft: #E3EEE8;
    --gold: #A9822E;
    --hl-word: #FFDE7A;
    --hl-word-ring: #C99A12;
    --hl-ayah: #F1E7CB;
    --shadow: rgba(43,38,32,0.14);
    --danger: #B5423A;
    --ok: #3F7A3F;
    --lvl1: #4E9A4E;
    --lvl2: #D8B22E;
    --lvl3: #DB8A3B;
    --lvl4: #C23B30;
    --radius: 16px;
    --qscale: 1;
  }
  html[data-theme="dark"]{
    --bg: #191C17;
    --bg-deep: #14160F;
    --surface: #21251D;
    --surface-soft: #262B21;
    --ink: #EEE9DA;
    --ink-soft: #A5A08D;
    --line: #383E30;
    --accent: #7FBFA0;
    --accent-deep: #5FA987;
    --accent-soft: #26362C;
    --gold: #D8B45D;
    --hl-word: #4E3C0E;
    --hl-word-ring: #C99A12;
    --hl-ayah: #2A2F22;
    --shadow: rgba(0,0,0,0.4);
    --danger: #E37167;
    --ok: #7FCB7F;
    --lvl1: #6FCB6F;
    --lvl2: #E8CB4F;
    --lvl3: #E8A15C;
    --lvl4: #E37167;
  }
  html[data-fontsize="sm"]{ --qscale: 0.82; }
  html[data-fontsize="md"]{ --qscale: 1; }
  html[data-fontsize="lg"]{ --qscale: 1.25; }
  html[data-fontsize="xl"]{ --qscale: 1.55; }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: "Tajawal", sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }
  .quran-text{
    font-family: "Amiri Quran", "Amiri", "Traditional Arabic", serif;
  }

  /* -------- Header -------- */
  header.topbar{
    flex:0 0 auto;
    background: linear-gradient(180deg, var(--accent-deep), var(--accent));
    color:#F5F2E5;
    padding: 6px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow: 0 2px 8px var(--shadow);
    z-index: 30;
    gap:8px;
  }
  header.topbar .brand{
    display:flex; align-items:center; gap:6px;
    font-weight:800; font-size:0.86rem;
  }
  header.topbar .brand .mark{
    width:22px;height:22px; border-radius:50%;
    border:1.5px solid rgba(245,242,229,0.55);
    display:flex;align-items:center;justify-content:center;font-size:11px;
  }
  .icon-btn{
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.28);
    color:#F5F2E5;
    border-radius:8px;
    width:28px;height:28px;
    font-size:0.78rem;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex:0 0 auto;
  }
  .icon-btn:active{ background: rgba(255,255,255,0.22); }
  .header-actions{ display:flex; gap:5px; align-items:center; }
  .sync-dot{ width:7px;height:7px;border-radius:50%; background:#C9C2A6; flex:0 0 auto; }
  .sync-dot.on{ background:#8FE0A8; }
  .sync-dot.err{ background:#E39B8F; }

  /* -------- مكاني في السورة + الانتقال السريع (مدموجين في شريط واحد) -------- */
  .place-bar{
    flex:0 0 auto;
    background: var(--surface);
    border:1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 2px 10px var(--shadow);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    margin: 0 12px calc(10px + env(safe-area-inset-bottom));
    text-align:center;
  }
  .place-progress{
    height:5px;
    border-radius:99px;
    background: var(--bg-deep);
    overflow:hidden;
    margin-top:10px;
  }
  .place-progress-fill{
    height:100%;
    width:0%;
    background: linear-gradient(90deg, var(--accent), var(--gold));
    border-radius:99px;
    transition: width .25s;
  }
  .jump-row{
    display:flex; gap:8px; align-items:center;
  }
  .jump-row select{
    flex:1;
    padding:9px 8px;
    border-radius:10px;
    border:1px solid var(--line);
    background: var(--surface-soft);
    color: var(--ink);
    font-family:inherit;
    font-size:0.86rem;
  }
  .jump-row button{
    flex:0 0 auto;
    background: var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:9px 14px;
    font-weight:700;
    font-size:0.84rem;
    cursor:pointer;
  }
  .jump-row button:active{ background: var(--accent-deep); }

  /* -------- Reading pane -------- */
  main.container{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    min-height:0;
    padding: 10px 12px 6px;
    gap:10px;
  }
  .reading-pane{
    flex:1 1 auto;
    min-height:0;
    background: var(--surface);
    border:1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 2px 10px var(--shadow);
    overflow-y:auto;
    padding: 14px 16px;
    scroll-behavior:smooth;
  }
  .surah-heading{
    text-align:center;
    font-weight:800;
    color: var(--accent-deep);
    font-size:0.92rem;
    padding-bottom:8px;
    margin-bottom:10px;
    border-bottom:1px dashed var(--line);
    position:sticky; top:-14px;
    background: var(--surface);
    padding-top:4px;
  }
  html[data-theme="dark"] .surah-heading{ color: var(--gold); }
  .ayahs-flow{
    line-height: 2.5;
    font-size: calc(1.35rem * var(--qscale));
    text-align:justify;
  }
  .ayah-block{
    display:inline-block;
    contain: layout style;
  }
  .ayah-num-badge{
    display:inline-flex;
    align-items:center; justify-content:center;
    width: calc(1.5em);
    height: calc(1.5em);
    font-size:0.55em;
    border:1.5px solid var(--accent);
    color: var(--accent-deep);
    border-radius:50%;
    margin:0 3px;
    vertical-align:middle;
    font-family:"Tajawal",sans-serif;
    font-weight:700;
  }
  html[data-theme="dark"] .ayah-num-badge{ color: var(--accent); }
  .w{
    cursor:pointer;
    border-radius:5px;
    padding:1px 2px;
    transition: background .12s;
  }
  .w:hover{ background: var(--accent-soft); }
  .ayah-block.cur-ayah{
    background: var(--hl-ayah);
    border-radius:8px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
    box-shadow: 0 0 0 3px var(--hl-ayah);
  }
  .w.cur-word{
    background: var(--hl-word);
    box-shadow: 0 0 0 2px var(--hl-word-ring);
  }
  body.mask-ahead .w.future{
    filter: blur(6px);
    opacity:0.42;
  }
  body.mask-ahead .w.future:hover{ opacity:0.6; }

  /* -------- درجات خطأ الكلمة (تبدأ أخضر وتميل للأحمر كل ما تتكرر) -------- */
  .w.lvl-1{ background: var(--lvl1); color:#fff; border-radius:5px; }
  .w.lvl-2{ background: var(--lvl2); color:#2B2620; border-radius:5px; }
  .w.lvl-3{ background: var(--lvl3); color:#fff; border-radius:5px; }
  .w.lvl-4{ background: var(--lvl4); color:#fff; border-radius:5px; }

  /* -------- ملاحظة على آية -------- */
  .ayah-block.ayah-note .ayah-num-badge{
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(169,130,46,0.12);
  }

  /* -------- أزرار الوسط (تسجيل خطأ / ملاحظة) -------- */
  .mid-btn{
    flex:0 0 40px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:0.85rem;
    background: var(--surface-soft);
    border:1.5px solid var(--line);
    min-height:34px;
  }
  .mid-btn:active{ transform: scale(0.93); }
  .mid-btn.note-btn.has-note{ background: rgba(169,130,46,0.18); border-color: var(--gold); }
  .mid-btn.err-btn.lvl-1{ background: color-mix(in srgb, var(--lvl1) 30%, var(--surface-soft)); border-color: var(--lvl1); }
  .mid-btn.err-btn.lvl-2{ background: color-mix(in srgb, var(--lvl2) 35%, var(--surface-soft)); border-color: var(--lvl2); }
  .mid-btn.err-btn.lvl-3{ background: color-mix(in srgb, var(--lvl3) 40%, var(--surface-soft)); border-color: var(--lvl3); }
  .mid-btn.err-btn.lvl-4{ background: color-mix(in srgb, var(--lvl4) 45%, var(--surface-soft)); border-color: var(--lvl4); }

  /* -------- Nav controls (علامات صغيرة بدل الأزرار الكبيرة) -------- */
  nav.nav-controls{
    flex:0 0 auto;
    padding: 6px 12px 8px;
    background: var(--surface-soft);
    border-top:1px solid var(--line);
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .nav-row{ display:flex; gap:6px; }
  .nav-btn{
    flex:1;
    border:none;
    border-radius:10px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-family:inherit;
    font-weight:700;
    font-size:0.8rem;
    color:#fff;
    min-height:34px;
    padding: 6px 4px;
    user-select:none;
  }
  .nav-btn:active{ transform: scale(0.96); }
  .nav-row.word-row .nav-btn{
    background: linear-gradient(180deg, var(--accent), var(--accent-deep));
  }
  .nav-row.ayah-row .nav-btn{
    background: var(--surface);
    color: var(--accent-deep);
    border: 1.5px solid var(--accent);
  }
  html[data-theme="dark"] .nav-row.ayah-row .nav-btn{ color: var(--accent); }
  .nav-btn:disabled{ opacity:0.35; cursor:not-allowed; }

  /* -------- Toast -------- */
  .toast{
    position:fixed; bottom:150px; left:50%; transform:translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bg);
    padding:9px 18px; border-radius:999px;
    font-size:0.82rem; opacity:0; pointer-events:none;
    transition: all .25s; z-index:100; max-width:88%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.err{ background: var(--danger); color:#fff; }

  /* -------- Auth panel -------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,18,12,0.55);
    display:none; align-items:center; justify-content:center; z-index:200; padding:16px;
  }
  .overlay.active{ display:flex; }
  .auth-card{
    background: var(--surface); border-radius:18px; padding:18px;
    width:100%; max-width:360px; box-shadow:0 10px 30px rgba(0,0,0,0.3);
  }
  .auth-card h3{ margin:0 0 10px; text-align:center; color:var(--accent-deep); }
  html[data-theme="dark"] .auth-card h3{ color:var(--gold); }
  .auth-tabs{ display:flex; gap:6px; margin-bottom:12px; }
  .auth-tabs button{
    flex:1; padding:8px; border-radius:10px; border:1px solid var(--line);
    background: var(--surface-soft); color:var(--ink); font-family:inherit; cursor:pointer;
  }
  .auth-tabs button.active{ background: var(--accent); color:#fff; border-color:var(--accent); }
  .auth-card input{
    width:100%; padding:10px; margin-bottom:8px; border-radius:10px;
    border:1px solid var(--line); background:var(--surface-soft); color:var(--ink); font-family:inherit;
  }
  .auth-msg{ font-size:0.8rem; min-height:1.2em; margin-bottom:6px; text-align:center; }
  .auth-msg.err{ color:var(--danger); }
  .auth-msg.ok{ color:var(--ok); }
  .auth-card .btn-row{ display:flex; gap:8px; }
  .auth-card .btn-row button{
    flex:1; padding:10px; border-radius:10px; border:none; cursor:pointer; font-family:inherit; font-weight:700;
  }
  .auth-card .btn-primary{ background:var(--accent); color:#fff; }
  .auth-card .btn-outline{ background:transparent; border:1px solid var(--line); color:var(--ink); }
  .user-line{ text-align:center; font-size:0.8rem; color:var(--ink-soft); margin-top:8px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="mark">📖</span> مصحف التنقل</div>
  <div class="header-actions">
    <span class="sync-dot" id="syncDot" title="حالة المزامنة"></span>
    <button class="icon-btn" id="btnFontSize" onclick="window.cycleFontSize()" title="حجم الخط">Aa</button>
    <button class="icon-btn" id="btnTheme" onclick="window.toggleTheme()" title="الوضع الليلي/النهاري">🌓</button>
    <button class="icon-btn" id="btnMask" onclick="window.toggleMask()" title="إخفاء الجزء اللي لسه ما وصلتش له">🙈</button>
    <button class="icon-btn" onclick="window.openAuth()" title="المزامنة">👤</button>
  </div>
</header>

<main class="container">
  <div class="reading-pane" id="readingPane">
    <div class="surah-heading" id="surahHeading">—</div>
    <div class="ayahs-flow" id="ayahsFlow"></div>
  </div>
</main>

<nav class="nav-controls">
  <div class="nav-row ayah-row">
    <button class="nav-btn" id="btnNextAyah" onclick="window.goNextAyah()">آية ›</button>
    <button class="mid-btn note-btn" id="btnAyahNote" onclick="window.markAyahNote()" title="ملاحظة على الآية الحالية">
      📝
    </button>
    <button class="nav-btn" id="btnPrevAyah" onclick="window.goPrevAyah()">‹ آية</button>
  </div>
  <div class="nav-row word-row">
    <button class="nav-btn" id="btnNextWord" onclick="window.goNextWord()">كلمة ›</button>
    <button class="mid-btn err-btn" id="btnWordErr" onclick="window.markWordError()" title="تسجيل خطأ على الكلمة الحالية">
      ⚠️
    </button>
    <button class="nav-btn" id="btnPrevWord" onclick="window.goPrevWord()">‹ كلمة</button>
  </div>
</nav>

<div class="place-bar">
  <div class="jump-row">
    <select id="jumpSurah"></select>
    <select id="jumpAyah"></select>
    <button onclick="window.doJump()">اذهب</button>
  </div>
  <div class="place-progress"><div class="place-progress-fill" id="placeProgressFill"></div></div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="authOverlay">
  <div class="auth-card">
    <h3>مزامنة موضعك بين أجهزتك</h3>
    <div class="auth-tabs">
      <button id="tabLogin" class="active" onclick="window.switchAuthTab('login')">دخول</button>
      <button id="tabSignup" onclick="window.switchAuthTab('signup')">حساب جديد</button>
    </div>
    <input type="email" id="authEmail" placeholder="البريد الإلكتروني">
    <input type="password" id="authPassword" placeholder="كلمة المرور">
    <div class="auth-msg" id="authMsg"></div>
    <div class="btn-row">
      <button class="btn-primary" id="authSubmitBtn" onclick="window.submitAuth()">تسجيل الدخول</button>
      <button class="btn-outline" onclick="window.closeAuth()">إغلاق</button>
    </div>
    <div class="user-line" id="userLine"></div>
  </div>
</div>

<script src="data/quran-data.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
